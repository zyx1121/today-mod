name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check release pull request
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: gh workflow run ci.yml --ref "$BRANCH"
      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - name: Attach plugin
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          tar -czf "today-mod-$TAG.tar.gz" hooks types .claude-plugin README.md LICENSE
          sha256sum "today-mod-$TAG.tar.gz" > "today-mod-$TAG.tar.gz.sha256"
          gh release upload "$TAG" "today-mod-$TAG.tar.gz" "today-mod-$TAG.tar.gz.sha256"
